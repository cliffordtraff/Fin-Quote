name: Pull Request Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current tree
        uses: actions/checkout@v6

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" \
            --output "/tmp/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" \
            | sha256sum --check
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks

      - name: Scan checked-out files for active secrets
        run: /tmp/gitleaks dir . --redact --no-banner

  application-checks:
    name: Type, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_CHARTING_URL: https://charts.example.invalid
          NEWSLETTER_PUBLIC_CHARTING_URL: https://charts.example.invalid
          NEXT_PUBLIC_ENABLE_LANDING: 'false'
        run: npm run build

      - name: Verify server build traces
        run: node scripts/verify-build-traces.mjs

  database-tests:
    name: Supabase pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11

      - name: Start the local Supabase database
        run: >-
          supabase start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations
        run: supabase db reset --local --no-seed

      - name: Run pgTAP database tests
        run: supabase test db --local supabase/tests
