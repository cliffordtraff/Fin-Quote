name: Daily Data Update

permissions:
  contents: read

# When to run this workflow
on:
  schedule:
    # Run every day at 2am UTC (adjust time as needed)
    - cron: '0 2 * * *'

  # Also allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  update-insider-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest insider trades
        run: npx tsx scripts/ingest-fmp-insiders.ts --limit 3000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Enrich recent Form 4 trades from SEC filings
        run: npx tsx scripts/enrich-sec-form4-trades.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Ingest SEC Form 144 proposed sales
        run: npx tsx scripts/ingest-sec-form144.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
