name: Newsletter Production Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-production-watchdog
  cancel-in-progress: true

jobs:
  newsletter-health:
    name: Check durable newsletter cron health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health endpoint
        shell: bash
        env:
          NEWSLETTER_HEALTH_URL: ${{ vars.NEWSLETTER_HEALTH_URL }}
        run: |
          set -euo pipefail
          health_url="${NEWSLETTER_HEALTH_URL:-https://www.theintraday.com/api/health/newsletter}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl_exit=0
          http_code="$(
            curl --silent --show-error --location \
              --connect-timeout 5 --max-time 20 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --output "$response_file" --write-out '%{http_code}' \
              "$health_url"
          )" || curl_exit=$?

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Newsletter health endpoint was unreachable (curl exit ${curl_exit})."
            exit 1
          fi

          if [ "$http_code" != '200' ]; then
            echo "::error::Newsletter health endpoint returned HTTP ${http_code}."
            sed -n '1,80p' "$response_file"
            exit 1
          fi

          if ! jq -e '.status == "healthy"' "$response_file" >/dev/null; then
            echo '::error::Newsletter health response was not healthy.'
            sed -n '1,80p' "$response_file"
            exit 1
          fi

          if jq -e '(.warnings // []) | any(.code == "webhook_not_configured" or .code == "webhook_configuration_invalid")' "$response_file" >/dev/null; then
            echo '::warning::Newsletter health is passing, but optional webhook delivery is disabled; inspect its production configuration.'
          fi
